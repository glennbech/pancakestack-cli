version: 2

project_name: pancakestack

before:
  hooks:
    - go mod tidy

builds:
  - id: pancakestack
    main: ./cmd/pancakestack
    binary: pancakestack
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: pancakestack
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: glennbech
    name: pancakestack-cli
  draft: false
  prerelease: auto

# Homebrew tap — goreleaser writes Casks/pancakestack.rb into
# glennbech/homebrew-tap on each release. Needs a PAT in HOMEBREW_TAP_TOKEN
# with write access to that repo (the default GITHUB_TOKEN can only write
# to the current repo). goreleaser v2 deprecated `brews` in favor of
# `homebrew_casks` — casks now cover pre-built CLI binaries too.
homebrew_casks:
  - name: pancakestack
    repository:
      owner: glennbech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/glennbech/pancakestack-cli
    description: "Stack your astro photos in the cloud"
    license: MIT
